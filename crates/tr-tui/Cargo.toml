[package]
name = "terminalreader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Render images inside the reader via kitty/iTerm2/sixel graphics
# (needs a capable terminal; falls back to the text placeholder).
inline-images = ["dep:ratatui-image", "dep:image"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
flate2.workspace = true
hex.workspace = true
# Decode-only formats; image's default features pull in the rav1e AVIF
# encoder whose BSD-2-Clause/NCSA licenses are rejected by deny.toml.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "rayon"], optional = true }
ratatui.workspace = true
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"], optional = true }
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
tar.workspace = true
tr-core = { path = "../tr-core" }
tr-epub = { path = "../tr-epub" }
tr-kosync = { path = "../tr-kosync" }
tr-render = { path = "../tr-render" }
unicode-width.workspace = true
url.workspace = true
zip.workspace = true

[lints]
workspace = true